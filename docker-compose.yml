# Local dev (Docker Postgres):
#   docker compose --profile local-db up -d --build
#
# Production (RDS — set DB_URL/DB_USERNAME/DB_PASSWORD in .env):
#   docker compose up -d --build
#
# The "postgres" hostname below is a Docker network alias (not RDS).
# For RDS, set DB_URL to your *.rds.amazonaws.com endpoint in .env.

services:
  farmtofolk-postgres:
    profiles: ["local-db"]
    image: postgres:17
    container_name: farmtofolk-postgres
    environment:
      POSTGRES_DB: farmtofolk_ledger
      POSTGRES_USER: farmtofolk
      POSTGRES_PASSWORD: farmtofolk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - farmtofolk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmtofolk -d farmtofolk_ledger"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      farmtofolk-network:
        aliases:
          - postgres

  farmtofolk-redis:
    image: redis:7
    container_name: farmtofolk-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      farmtofolk-network:
        aliases:
          - redis

  farmtofolk-api:
    build: .
    container_name: farmtofolk-api
    depends_on:
      farmtofolk-redis:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/farmtofolk_ledger}
      DB_USERNAME: ${DB_USERNAME:-farmtofolk}
      DB_PASSWORD: ${DB_PASSWORD:-farmtofolk}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-farmtofolk-ledger-dev}
      AWS_S3_PRESIGNED_EXPIRY_MINUTES: ${AWS_S3_PRESIGNED_EXPIRY_MINUTES:-15}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-bytes}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-FarmToFolk Admin}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - farmtofolk-network

volumes:
  farmtofolk-postgres-data:

networks:
  farmtofolk-network:
