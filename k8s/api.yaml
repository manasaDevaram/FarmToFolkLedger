# Set ECR_IMAGE in api.yaml before apply, e.g.:
# 505346010044.dkr.ecr.ap-south-1.amazonaws.com/farmtofolk-api:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmtofolk-api
  namespace: farmtofolk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: farmtofolk-api
  template:
    metadata:
      labels:
        app: farmtofolk-api
    spec:
      containers:
        - name: api
          image: REPLACE_WITH_ECR_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: farmtofolk-api
  namespace: farmtofolk
spec:
  type: NodePort
  selector:
    app: farmtofolk-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
